<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>AI Handoff Builder - HyperFrames Photo Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #080808; }
    body { font-family: Arial, Helvetica, sans-serif; }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0b0b0b;
      color: #ffffff;
    }

    .shot {
      position: absolute;
      inset: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      object-fit: cover;
      opacity: 0;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18), transparent 28%),
        linear-gradient(to top, rgba(0, 0, 0, 0.62), transparent 38%);
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.12) 0,
        rgba(255,255,255,0.12) 1px,
        transparent 1px,
        transparent 4px
      );
    }

    .eyebrow {
      position: absolute;
      left: 74px;
      bottom: 258px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(18px);
      will-change: opacity, transform;
    }

    .title {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 120px;
      margin: 0;
      font-size: 82px;
      line-height: 0.98;
      letter-spacing: -0.035em;
      text-shadow: 0 4px 24px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(24px);
      will-change: opacity, transform;
    }

    .progress {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 70px;
      height: 5px;
      background: rgba(255,255,255,0.22);
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: #ffffff;
      will-change: width;
    }

    .badge {
      position: absolute;
      top: 74px;
      right: 70px;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 999px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <main data-hf-id="hf-yn1p" id="stage" data-composition-id="ai-handoff-hyperframes-photo-demo" data-start="0" data-duration="12" data-width="1080" data-height="1920">
    <img data-hf-id="hf-t18b" id="shot-1" class="clip shot" src="assets/01-wide.jpg" alt="" data-start="0" data-duration="2.4" data-track-index="0">
    <img data-hf-id="hf-6ujm" id="shot-2" class="clip shot" src="assets/02-wide.jpg" alt="" data-start="2" data-duration="2.4" data-track-index="1">
    <img data-hf-id="hf-0mzj" id="shot-3" class="clip shot" src="assets/03-medium.jpg" alt="" data-start="4" data-duration="2.4" data-track-index="0">
    <img data-hf-id="hf-lmbu" id="shot-4" class="clip shot" src="assets/04-portrait.jpg" alt="" data-start="6" data-duration="2.4" data-track-index="1">
    <img data-hf-id="hf-4y3s" id="shot-5" class="clip shot" src="assets/05-close.jpg" alt="" data-start="8" data-duration="2.4" data-track-index="0">
    <img data-hf-id="hf-rkay" id="shot-6" class="clip shot" src="assets/06-close.jpg" alt="" data-start="10" data-duration="2" data-track-index="1">

    <div data-hf-id="hf-q0n7" class="shade"></div>
    <div data-hf-id="hf-h60x" class="grain"></div>
    <div data-hf-id="hf-27zg" class="badge">HyperFrames Lab</div>
    <div data-hf-id="hf-c5m2" id="eyebrow" class="eyebrow" data-layout-allow-overlap="true">Casual cafe moment</div>
    <h1 data-hf-id="hf-y09u" id="title" class="title" data-layout-allow-overlap="true">From a wide scene<br data-hf-id="hf-x5px">to a close expression.</h1>
    <div data-hf-id="hf-31j5" class="progress"><span data-hf-id="hf-fr3r" id="progress-bar"></span></div>
  </main>

  <script>
    (() => {
      "use strict";

      const duration = 12;
      const fade = 0.32;
      const shots = [
        { id: "shot-1", start: 0, length: 2.4, scaleA: 1.0, scaleB: 1.07, xA: 0, xB: -18, yA: 0, yB: 12 },
        { id: "shot-2", start: 2, length: 2.4, scaleA: 1.08, scaleB: 1.15, xA: 18, xB: -8, yA: 4, yB: -10 },
        { id: "shot-3", start: 4, length: 2.4, scaleA: 1.03, scaleB: 1.12, xA: -8, xB: 8, yA: 6, yB: -6 },
        { id: "shot-4", start: 6, length: 2.4, scaleA: 1.02, scaleB: 1.1, xA: 5, xB: -7, yA: 8, yB: -8 },
        { id: "shot-5", start: 8, length: 2.4, scaleA: 1.05, scaleB: 1.15, xA: -8, xB: 8, yA: 2, yB: -5 },
        { id: "shot-6", start: 10, length: 2.0, scaleA: 1.08, scaleB: 1.18, xA: 8, xB: -4, yA: 4, yB: -8 },
      ];

      const eyebrow = document.getElementById("eyebrow");
      const title = document.getElementById("title");
      const progressBar = document.getElementById("progress-bar");

      const clamp01 = (value) => Math.max(0, Math.min(1, value));
      const mix = (a, b, p) => a + (b - a) * p;
      const smooth = (p) => p * p * (3 - 2 * p);

      function localOpacity(localTime, length) {
        const fadeIn = clamp01(localTime / fade);
        const fadeOut = clamp01((length - localTime) / fade);
        return Math.min(fadeIn, fadeOut);
      }

      function setTime(timeSeconds) {
        const t = Math.max(0, Math.min(duration, Number(timeSeconds) || 0));

        for (const shot of shots) {
          const element = document.getElementById(shot.id);
          const local = t - shot.start;
          if (local < 0 || local > shot.length) {
            element.style.opacity = "0";
            continue;
          }

          const p = smooth(clamp01(local / shot.length));
          const scale = mix(shot.scaleA, shot.scaleB, p);
          const x = mix(shot.xA, shot.xB, p);
          const y = mix(shot.yA, shot.yB, p);
          element.style.opacity = String(localOpacity(local, shot.length));
          element.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
        }

        const textIn = smooth(clamp01((t - 0.45) / 0.65));
        const textOut = smooth(clamp01((duration - t) / 0.75));
        const textOpacity = Math.min(textIn, textOut);
        eyebrow.style.opacity = String(textOpacity);
        eyebrow.style.transform = `translateY(${mix(18, 0, textIn)}px)`;
        title.style.opacity = String(textOpacity);
        title.style.transform = `translateY(${mix(24, 0, textIn)}px)`;
        progressBar.style.width = `${(t / duration) * 100}%`;
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["ai-handoff-hyperframes-photo-demo"] = {
        seek(timeSeconds) {
          setTime(timeSeconds);
        },
      };

      window.addEventListener("hf-seek", (event) => {
        setTime(event.detail && typeof event.detail.time === "number" ? event.detail.time : 0);
      });

      setTime(0);
    })();
  </script>
</body>
</html>
